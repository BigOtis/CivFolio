<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc">
  <title id="title">Prescriptive Small-Site Stack</title>
  <desc id="desc">Standard cloud primitives structured for reliable, repeatable agent-driven deployments.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#e2e8f0" stroke-width="0.5" stroke-dasharray="4 4"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#94a3b8"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { fill: #0f172a; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
      .subtitle { fill: #64748b; font-weight: 400; font-size: 16px; }
      
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .card-main { fill: #ffffff; stroke: #cbd5e1; stroke-width: 2px; }
      
      .node-title { fill: #1e293b; font-weight: 600; font-size: 16px; }
      .node-desc { fill: #64748b; font-weight: 400; font-size: 13px; }
      
      .conn-line { stroke: #cbd5e1; stroke-width: 2; fill: none; stroke-dasharray: 6 6; animation: flow 15s linear infinite; }
      
      .node { transform-origin: center; transition: transform 0.3s ease; }
      .node:hover { transform: translateY(-4px); }
      
      .core-pulse { animation: corePulse 4s ease-in-out infinite; transform-origin: center; }
      
      @keyframes flow { to { stroke-dashoffset: -200; } }
      @keyframes corePulse {
        0% { transform: scale(0.98); opacity: 0.8; }
        50% { transform: scale(1.02); opacity: 1; }
        100% { transform: scale(0.98); opacity: 0.8; }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="24" fill="url(#grid)"/>

  <!-- Header -->
  <text x="48" y="60" class="title">Prescriptive Small-Site Stack</text>
  <text x="48" y="88" class="subtitle">Standard cloud primitives structured for reliable, repeatable agent-driven deployments.</text>

  <!-- Connections -->
  <!-- GitHub to Cloud Run -->
  <path class="conn-line" d="M 240 200 L 390 200" marker-end="url(#arrow)"/>
  
  <!-- Cloud Run to MongoDB -->
  <path class="conn-line" d="M 570 200 L 720 200" marker-end="url(#arrow)"/>
  
  <!-- Cloud Run to Cloud Storage -->
  <path class="conn-line" d="M 440 270 C 440 285, 315 285, 315 300" marker-end="url(#arrow)"/>
  
  <!-- Domain to Cloud Run -->
  <path class="conn-line" d="M 645 300 C 645 285, 520 285, 520 270" marker-end="url(#arrow)"/>

  <!-- Node: GitHub (Source) -->
  <g class="node" transform="translate(60, 140)">
    <rect width="180" height="120" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="66" y="20" width="48" height="48" rx="12" fill="#f8fafc"/>
    <g transform="translate(70, 24)">
      <path d="M20 0C8.96 0 0 8.96 0 20c0 8.84 5.74 16.34 13.7 18.98 1 .18 1.36-.43 1.36-.96 0-.48-.02-1.74-.03-3.41-5.56 1.21-6.73-2.68-6.73-2.68-.91-2.31-2.22-2.93-2.22-2.93-1.82-1.24.14-1.22.14-1.22 2.01.14 3.07 2.07 3.07 2.07 1.79 3.06 4.69 2.18 5.83 1.67.18-1.29.7-2.18 1.28-2.68-4.44-.5-9.11-2.22-9.11-9.88 0-2.18.78-3.96 2.06-5.36-.21-.5-.89-2.54.2-5.28 0 0 1.68-.54 5.48 2.01 1.6-.44 3.31-.67 5.02-.68 1.71.01 3.42.24 5.02.68 3.8-2.55 5.48-2.01 5.48-2.01 1.09 2.74.41 4.78.2 5.28 1.28 1.4 2.06 3.18 2.06 5.36 0 7.68-4.68 9.37-9.13 9.87.72.62 1.36 1.84 1.36 3.71 0 2.68-.02 4.84-.02 5.48 0 .54.36 1.15 1.38.96C34.27 36.33 40 28.83 40 20 40 8.96 31.04 0 20 0z" fill="#1e293b"/>
    </g>
    <text x="90" y="94" text-anchor="middle" class="node-title">GitHub</text>
    <text x="90" y="112" text-anchor="middle" class="node-desc">Source of truth</text>
  </g>

  <!-- Node: Cloud Run (Compute) -->
  <g class="node" transform="translate(390, 130)">
    <ellipse cx="90" cy="70" rx="120" ry="80" fill="#eff6ff" filter="url(#glow)" class="core-pulse"/>
    <rect width="180" height="140" rx="20" class="card-main" filter="url(#shadow)"/>
    <g transform="translate(66, 24)">
      <polygon points="24,2 44,13 44,35 24,46 4,35 4,13" fill="#3b82f6"/>
      <path d="M16 18l-6 6 6 6M32 18l6 6-6 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    </g>
    <text x="90" y="104" text-anchor="middle" class="node-title">Cloud Run App</text>
    <text x="90" y="122" text-anchor="middle" class="node-desc">Scale-to-zero compute</text>
  </g>

  <!-- Node: MongoDB (Data) -->
  <g class="node" transform="translate(720, 140)">
    <rect width="180" height="120" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="66" y="20" width="48" height="48" rx="12" fill="#f0fdf4"/>
    <g transform="translate(70, 24)">
      <path d="M20 2c0 0-12 6-12 18 0 8 6 12 10 18 1 1 3 1 4 0 4-6 10-10 10-18 0-12-12-18-12-18z" fill="#10b981"/>
      <path d="M20 2v36c4-6 10-10 10-18 0-12-12-18-12-18z" fill="#047857" opacity="0.5"/>
    </g>
    <text x="90" y="94" text-anchor="middle" class="node-title">MongoDB Atlas</text>
    <text x="90" y="112" text-anchor="middle" class="node-desc">Flexible app data</text>
  </g>

  <!-- Node: Cloud Storage (Assets) -->
  <g class="node" transform="translate(225, 300)">
    <rect width="180" height="120" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="66" y="20" width="48" height="48" rx="12" fill="#eff6ff"/>
    <g transform="translate(70, 28)">
      <ellipse cx="20" cy="6" rx="16" ry="6" fill="#93c5fd"/>
      <path d="M4 6v16c0 3.31 7.16 6 16 6s16-2.69 16-6V6" fill="#3b82f6"/>
      <ellipse cx="20" cy="22" rx="16" ry="6" fill="#2563eb" opacity="0.3"/>
      <path d="M4 14c0 3.31 7.16 6 16 6s16-2.69 16-6" stroke="#60a5fa" stroke-width="2" fill="none"/>
    </g>
    <text x="90" y="94" text-anchor="middle" class="node-title">Cloud Storage</text>
    <text x="90" y="112" text-anchor="middle" class="node-desc">Static assets</text>
  </g>

  <!-- Node: Domain + DNS (Edge) -->
  <g class="node" transform="translate(555, 300)">
    <rect width="180" height="120" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="66" y="20" width="48" height="48" rx="12" fill="#f5f3ff"/>
    <g transform="translate(70, 24)">
      <circle cx="20" cy="20" r="18" fill="#8b5cf6"/>
      <ellipse cx="20" cy="20" rx="8" ry="18" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
      <path d="M2 20h36M8 10h24M8 30h24" stroke="#ffffff" stroke-width="2" fill="none" opacity="0.6"/>
    </g>
    <text x="90" y="94" text-anchor="middle" class="node-title">Domain + DNS</text>
    <text x="90" y="112" text-anchor="middle" class="node-desc">Custom URL routing</text>
  </g>
</svg>