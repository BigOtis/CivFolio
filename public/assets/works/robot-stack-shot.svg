<svg xmlns="http://www.w3.org/2000/svg" width="960" height="360" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
  <title id="title">Agent-Guided Deployment Flow</title>
  <desc id="desc">Give your AI agent a prescriptive path to deploy, configure, and verify your site.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f8fafc"/>
    </linearGradient>
    <pattern id="dots" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5" fill="#94a3b8" opacity="0.25"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1L8 5L0 9z" fill="#64748b"/>
    </marker>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; }
      .title { fill: #0f172a; font-weight: 700; font-size: 28px; letter-spacing: -0.5px; }
      .subtitle { fill: #64748b; font-weight: 400; font-size: 16px; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1px; }
      .card-title { fill: #1e293b; font-weight: 600; font-size: 16px; }
      .card-desc { fill: #64748b; font-weight: 400; font-size: 13px; }
      .badge-text { fill: #475569; font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: 0.5px; }
      .flow-line { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 6; animation: flow 20s linear infinite; }
      .icon-bg { fill: #f1f5f9; }
      
      .card-group { transform-origin: center; transition: all 0.3s ease; }
      .card-group:hover { transform: translateY(-4px); }
      
      @keyframes flow { to { stroke-dashoffset: -400; } }
      @keyframes pulse { 
        0% { transform: scale(0.95); opacity: 0.5; } 
        50% { transform: scale(1.05); opacity: 0.8; } 
        100% { transform: scale(0.95); opacity: 0.5; } 
      }
      .pulse-dot { animation: pulse 3s ease-in-out infinite; transform-origin: center; }
      .pulse-dot-2 { animation: pulse 3s ease-in-out infinite 1s; transform-origin: center; }
      .pulse-dot-3 { animation: pulse 3s ease-in-out infinite 2s; transform-origin: center; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
  <rect width="100%" height="100%" rx="24" fill="url(#dots)"/>

  <!-- Header -->
  <text x="48" y="60" class="title">Agent-Guided Deployment Flow</text>
  <text x="48" y="88" class="subtitle">Give your AI agent a prescriptive path to deploy, configure, and verify your site.</text>

  <!-- Agent Logos -->
  <g transform="translate(760, 40)">
    <rect x="0" y="0" width="160" height="48" rx="24" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
    <text x="42" y="29" text-anchor="middle" fill="#1e293b" font-weight="700" font-size="15">Codex</text>
    <line x1="84" y1="12" x2="84" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <text x="122" y="29" text-anchor="middle" fill="#1e293b" font-weight="700" font-size="15">Claude</text>
  </g>

  <!-- Flow Lines -->
  <path class="flow-line" d="M 228 190 L 276 190" marker-end="url(#arrow)"/>
  <path class="flow-line" d="M 456 190 L 504 190" marker-end="url(#arrow)"/>
  <path class="flow-line" d="M 684 190 L 732 190" marker-end="url(#arrow)"/>

  <!-- Card 1: Check tools -->
  <g class="card-group" transform="translate(48, 120)">
    <rect width="180" height="140" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="70" y="20" width="40" height="40" rx="12" class="icon-bg" fill="#eff6ff"/>
    <path d="M82 40h16M90 32v16" stroke="#3b82f6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="138" cy="40" r="4" fill="#3b82f6" class="pulse-dot"/>
    <text x="90" y="90" text-anchor="middle" class="card-title">Check Tools</text>
    <text x="90" y="112" text-anchor="middle" class="card-desc">git, gh, gcloud,</text>
    <text x="90" y="130" text-anchor="middle" class="card-desc">node, npm</text>
  </g>

  <!-- Card 2: Collect config -->
  <g class="card-group" transform="translate(276, 120)">
    <rect width="180" height="140" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="70" y="20" width="40" height="40" rx="12" class="icon-bg" fill="#ecfdf5"/>
    <path d="M80 40l6 6 14-14" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <circle cx="138" cy="40" r="4" fill="#10b981" class="pulse-dot-2"/>
    <text x="90" y="90" text-anchor="middle" class="card-title">Collect Config</text>
    <text x="90" y="112" text-anchor="middle" class="card-desc">Project, region,</text>
    <text x="90" y="130" text-anchor="middle" class="card-desc">secrets, domain</text>
  </g>

  <!-- Card 3: Deploy safely -->
  <g class="card-group" transform="translate(504, 120)">
    <rect width="180" height="140" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="70" y="20" width="40" height="40" rx="12" class="icon-bg" fill="#fef2f2"/>
    <g transform="translate(76, 26)">
      <path d="M22 10c0-4.4-3.6-8-8-8-3.5 0-6.5 2.3-7.6 5.5C5.3 7.2 4.2 7 3 7 1.3 7 0 8.3 0 10s1.3 3 3 3h19c2.8 0 5-2.2 5-5s-2.2-5-5-5z" fill="#ef4444"/>
    </g>
    <circle cx="138" cy="40" r="4" fill="#ef4444" class="pulse-dot-3"/>
    <text x="90" y="90" text-anchor="middle" class="card-title">Deploy Safely</text>
    <text x="90" y="112" text-anchor="middle" class="card-desc">Env vars, secrets,</text>
    <text x="90" y="130" text-anchor="middle" class="card-desc">readiness checks</text>
  </g>

  <!-- Card 4: Verify live URL -->
  <g class="card-group" transform="translate(732, 120)">
    <rect width="180" height="140" rx="16" class="card" filter="url(#shadow)"/>
    <rect x="70" y="20" width="40" height="40" rx="12" class="icon-bg" fill="#f5f3ff"/>
    <path d="M78 40h24M90 28v24" stroke="#8b5cf6" stroke-width="3" stroke-linecap="round"/>
    <circle cx="138" cy="40" r="4" fill="#8b5cf6" class="pulse-dot"/>
    <text x="90" y="90" text-anchor="middle" class="card-title">Verify Live URL</text>
    <text x="90" y="112" text-anchor="middle" class="card-desc">Ready revision &amp;</text>
    <text x="90" y="130" text-anchor="middle" class="card-desc">health checks</text>
  </g>

  <!-- Phase Indicators -->
  <g transform="translate(48, 290)">
    <rect width="180" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="90" y="21" text-anchor="middle" class="badge-text">One-Time Setup</text>
  </g>
  
  <g transform="translate(276, 290)">
    <rect width="408" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="204" y="21" text-anchor="middle" class="badge-text">Repeatable Deploys</text>
  </g>

  <g transform="translate(732, 290)">
    <rect width="180" height="32" rx="16" fill="#f1f5f9" stroke="#e2e8f0"/>
    <text x="90" y="21" text-anchor="middle" class="badge-text">Owned Cloud</text>
  </g>
</svg>